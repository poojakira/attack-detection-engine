[tool.ruff]
# Alembic migration scripts are autogenerated; don't lint their style.
extend-exclude = ["detection_engine/platform/migrations/*"]

[tool.ruff.format]
line-ending = "lf"


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attack-detection-engine"
version = "1.0.0"
description = "ATT&CK-mapped detection engine with log, traffic, behavior, event, and code detectors"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "attack-v19-core @ git+https://github.com/poojakira/attack-v19-core.git@087accffc7d9ba7e2c086b9ef72ef7ac6f23c29b",
    "mitreattack-python==3.0.3",
    "stix2==3.0.1",
    "taxii2-client==2.3.0",
    "networkx==3.3",
    "pandas==2.2.2",
    "pydantic==2.7.4",
    "redis==5.0.6",
    "structlog==24.2.0",
    "tqdm==4.70.1",
    "httpx==0.27.0",
    "PyYAML==6.0.3",
    "scapy==2.7.0",
    "lxml>=6.1.0",
]

[project.scripts]
attack-detect = "detection_engine.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
platform = [
    "fastapi==0.116.2",
    "starlette==1.3.1",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["detection_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"