[tool.ruff.format]
line-ending = "lf"


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attack-detection-engine"
version = "1.0.0"
description = "ATT&CK-mapped detection engine with log, traffic, behavior, event, and code detectors"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "attack-v19-core>=19.2,<20",
    "mitreattack-python==3.0.3",
    "stix2==3.0.1",
    "taxii2-client==2.3.0",
    "networkx==3.4.2",
    "pandas==2.2.2",
    "pydantic==2.7.4",
    "redis==5.0.6",
    "structlog==24.2.0",
    "tqdm==4.70.1",
    "httpx==0.27.0",
    "PyYAML==6.0.3",
    "scapy==2.7.0",
    "lxml>=6.1.0",
]

[project.scripts]
attack-detect = "detection_engine.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["detection_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"