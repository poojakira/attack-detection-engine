name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ATTACK_CORE_REF: "274dd164690373072e7c84110b8d71c8419f1a12"

concurrency:
  group: production-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout attack-v19-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: poojakira/attack-v19-core
          ref: ${{ env.ATTACK_CORE_REF }}
          path: attack-v19-core
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip build
      - name: Install
        run: |
          python -m pip install -e ./attack-v19-core
          python attack-v19-core/scripts/download_attack_data.py
          python -m pip install -e ".[dev]"
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Static quality gate
        run: python -m pip install ruff==0.8.4 && python -m ruff check detection_engine tests
      - name: Build/release smoke check
        run: python -m build
