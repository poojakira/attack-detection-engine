name: One-time Ruff format remediation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ruff-format-remediation-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'chore: run verified Ruff formatting'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Apply and verify formatter
        run: |
          python -m pip install ruff==0.8.4
          ruff format detection_engine tests
          ruff check detection_engine tests
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply verified Ruff formatting"
          git push origin HEAD:main
