name: One-time Ruff format remediation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ruff-format-remediation-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: "${{ github.event.head_commit.message == 'chore: run verified Ruff formatting' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Apply and verify formatter
        run: |
          python -m pip install ruff==0.8.4
          ruff format detection_engine tests
          ruff check detection_engine tests
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply verified Ruff formatting"
          git push origin HEAD:main
