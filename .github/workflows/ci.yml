name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.8.4"
  ATTACK_CORE_REF: "274dd164690373072e7c84110b8d71c8419f1a12"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install ruff==${{ env.RUFF_VERSION }}

      - name: Run Ruff Linter
        run: ruff check detection_engine tests --output-format=github

      - name: Run Ruff Formatter Check
        run: ruff format --check detection_engine tests

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout attack-v19-core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: poojakira/attack-v19-core
          ref: ${{ env.ATTACK_CORE_REF }}
          path: attack-v19-core

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e ./attack-v19-core
          python attack-v19-core/scripts/download_attack_data.py
          pip install -e ".[dev]" 2>&1 | tail -5

      - name: Run tests with coverage
        run: |
          PYTHONPATH=.:attack-v19-core pytest tests/ -v --tb=short \
            --cov=detection_engine \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=53

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30

      - name: Verify test collection
        run: |
          count=$(PYTHONPATH=.:attack-v19-core python -m pytest tests/ --collect-only -q 2>/dev/null | tail -1 | grep -oP '\d+(?= tests)')
          count=${count:-0}
          if [ "$count" -lt 5 ]; then
            echo "Expected at least 5 tests collected, got $count"
            exit 1
          fi
          echo "Collected $count tests"

  security-gate:
    name: Repository Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout attack-v19-core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: poojakira/attack-v19-core
          ref: ${{ env.ATTACK_CORE_REF }}
          path: attack-v19-core

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tooling and project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.8.3 pip-audit==2.10.1 cyclonedx-bom==5.1.1
          pip install -e ./attack-v19-core
          pip install -e ".[dev]"

      - name: Run Bandit SAST
        run: |
          mkdir -p security-reports
          bandit -r detection_engine -ll -f json -o security-reports/bandit.json || true

      - name: Audit Python dependencies
        run: |
          python -m pip_audit --format json --output security-reports/pip-audit.json || audit_exit=$?
          test -f security-reports/pip-audit.json
          echo "pip-audit exit code: ${audit_exit:-0}"

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --outfile security-reports/sbom.json

      - name: Enforce repository security policy
        run: |
          python .github/scripts/security_gate.py \
            --bandit security-reports/bandit.json \
            --pip-audit security-reports/pip-audit.json \
            --allowlist .github/security-allowlist.json \
            --summary security-reports/security-summary.md

      - name: Upload repository security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-security-report
          path: security-reports/
          retention-days: 90