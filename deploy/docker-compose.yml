# Aegis HealthSec — controlled local / pilot deployment (hardened).
#
# Required secrets (no defaults — deployment refuses to start without them):
#   export AEGIS_DB_PASSWORD=$(openssl rand -hex 24)
#   export AEGIS_JWT_SECRET=$(openssl rand -hex 32)
#   export AEGIS_ADMIN_USER=admin AEGIS_ADMIN_PASSWORD=<strong-password>
#   docker compose -f deploy/docker-compose.yml up --build
#
# Security posture:
#   * No default credentials; missing secrets fail closed.
#   * PostgreSQL has NO host port published (reachable only on the internal
#     compose network). Backend dev port binds to 127.0.0.1 only. Front-end dev
#     port binds to 127.0.0.1 only. For remote pilot access, terminate TLS at a
#     reverse proxy in front of the frontend (see PLATFORM.md / RUNBOOK.md).
#   * Containers run as non-root, no-new-privileges, with dropped Linux
#     capabilities and (where compatible) read-only root filesystems.
services:
  postgres:
    image: postgres:15.8
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${AEGIS_DB_PASSWORD:?set AEGIS_DB_PASSWORD (no default)}
      POSTGRES_DB: aegis
    volumes:
      - aegis_pgdata:/var/lib/postgresql/data
    # No published host port: PostgreSQL is reachable only on the internal
    # compose network, reducing external attack surface.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      AEGIS_DATABASE_URL: postgresql+psycopg://aegis:${AEGIS_DB_PASSWORD:?set AEGIS_DB_PASSWORD}@postgres:5432/aegis
      AEGIS_JWT_SECRET: ${AEGIS_JWT_SECRET:?set AEGIS_JWT_SECRET (min 32 chars)}
      AEGIS_ADMIN_USER: ${AEGIS_ADMIN_USER:-}
      AEGIS_ADMIN_PASSWORD: ${AEGIS_ADMIN_PASSWORD:-}
      AEGIS_ADMIN_ORG: ${AEGIS_ADMIN_ORG:-default}
      AEGIS_REQUIRE_SECURE_CONFIG: "1"
      # Some transitive deps (stixmarx via mitreattack) write a cache under HOME
      # at import time; point HOME at a writable tmpfs so the root FS stays RO.
      HOME: /home/aegis
    depends_on:
      postgres:
        condition: service_healthy
    # Dev convenience port bound to localhost only (not 0.0.0.0). Behind a TLS
    # proxy for any non-local access.
    ports:
      - "127.0.0.1:8000:8000"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
      - /home/aegis:uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1g

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    # Localhost-only dev port; front a TLS-terminating proxy for pilot access.
    ports:
      - "127.0.0.1:8080:80"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  aegis_pgdata:
